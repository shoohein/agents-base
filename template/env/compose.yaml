services:
  agent:
    image: agents/<forge>/<org>/<repo>
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENCODE_CONFIG: /agent-env/opencode.jsonc
      TZ: ${TZ:-Asia/Tokyo}
      SSH_AUTH_SOCK: /ssh-agent
    working_dir: /workspaces/main
    volumes:
      - type: bind
        source: ~/<forge>/<org>/<repo>
        target: /workspaces/main
      - type: bind
        source: ../opencode
        target: /workspaces/.opencode
      - type: bind
        source: ../worklogs
        target: /worklogs
      - type: bind
        source: .
        target: /agent-env
      - type: bind
        source: ../../../../opencode
        target: /.opencode
      - type: bind
        source: ${AGENT_HOME:?export AGENT_HOME required}
        target: /home/agent
      - type: bind
        source: ${SSH_AUTH_SOCK:-/dev/null}
        target: /ssh-agent
        read_only: true
